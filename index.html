    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.main-nav a').forEach(l => l.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById('nav-'+pageId).classList.add('active');
            window.scrollTo(0,0);
        }

        function showArticle(articleNum) {
            showPage('blog');
            document.getElementById('article' + articleNum).classList.add('active');
            window.scrollTo(0,0);
        }

        const areaRange = document.getElementById('areaRange');
        const areaValue = document.getElementById('areaValue');
        const technologySelect = document.getElementById('technologySelect');
        const foundation = document.getElementById('foundation');
        const finishSelect = document.getElementById('finishSelect');
        const totalPrice = document.getElementById('totalPrice');

        function calculatePrice() {
            const area = parseInt(areaRange.value);
            const basePrice = parseInt(technologySelect.value);
            const foundationMultiplier = parseFloat(foundation.value);
            const finishMultiplier = parseFloat(finishSelect.value);
            const total = Math.round(area * basePrice * foundationMultiplier * finishMultiplier);
            totalPrice.textContent = total.toLocaleString('ru-RU') + ' ₽';
            areaValue.textContent = area + ' м²';
        }

        areaRange.addEventListener('input', calculatePrice);
        technologySelect.addEventListener('change', calculatePrice);
        foundation.addEventListener('change', calculatePrice);
        finishSelect.addEventListener('change', calculatePrice);
        calculatePrice();

        function saveToPDF() {
            const printContent = '<html><head><title>Расчёт</title></head><body style="font-family:Arial;padding:40px;"><h1 style="color:#4a5568;text-align:center;">Расчёт стоимости</h1><p style="text-align:center;color:#718096;">'+new Date().toLocaleDateString('ru-RU')+'</p><h2 style="color:#4a5568;">Параметры</h2><p><strong>Площадь:</strong> '+areaRange.value+' м²</p><p><strong>Технология:</strong> '+technologySelect.options[technologySelect.selectedIndex].text+'</p><p><strong>Фундамент:</strong> '+foundation.options[foundation.selectedIndex].text+'</p><p><strong>Отделка:</strong> '+finishSelect.options[finishSelect.selectedIndex].text+'</p><h2 style="color:#4a5568;margin-top:30px;">Стоимость</h2><p style="font-size:2.5rem;font-weight:700;color:#4a5568;">'+totalPrice.textContent+'</p></body></html>';
            const w = window.open('','','width=800,height=600');
            w.document.write(printContent);
            w.document.close();
            setTimeout(()=>w.print(),300);
        }
    </script>
